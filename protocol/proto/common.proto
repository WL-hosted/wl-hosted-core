// WL-hosted protocol common schema. The fixed Frame/RPC headers are not protobuf.
syntax = "proto3";

package wlh.protocol.v1;

message Empty {}

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}
message VersionRange {
  uint32 major = 1;
  uint32 min_minor = 2;
  uint32 max_minor = 3;
}

message ServiceVersionRange {
  uint32 service_id = 1;
  uint32 major = 2;
  uint32 min_minor = 3;
  uint32 max_minor = 4;
}

message VendorStatus {
  uint32 vendor_id = 1;
  sint32 code = 2;
  bytes detail = 3;
}
